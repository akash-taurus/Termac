syntax = "proto3";

package dashboard.plugin;
option go_package = "tui/pkg/proto/plugin";

service WidgetPlugin {
  rpc FetchData(FetchRequest) returns (FetchResponse);
  rpc Render(RenderRequest) returns (RenderResponse);
}

message FetchRequest {
  string plugin_id = 1;
}

message FetchResponse {
  string data = 1;
}

message RenderRequest {
  string plugin_id = 1;
  int32 width = 2;
  int32 height = 3;
}

message RenderResponse {
  string rendered_string = 1;
}
